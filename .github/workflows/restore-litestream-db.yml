name: Restore Litestream Database to S3

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *' # Run once a day at 6:30am (after the scraper runs)

jobs:
  restore-db:
    runs-on: ubuntu-latest
    steps:
      - name: Install Litestream v0.3.13
        run: |
          wget https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.tar.gz
          tar -xzf litestream-v0.3.13-linux-amd64.tar.gz
          sudo mv litestream /usr/local/bin/
          litestream version

      - name: Restore database from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-1
        run: |
          mkdir -p /tmp/db
          litestream restore -o /tmp/db/epa_ireland.db s3://epa-rss/litestream

      - name: Verify restored database
        run: |
          if [ -f /tmp/db/epa_ireland.db ]; then
            echo "Database restored successfully"
            ls -lh /tmp/db/epa_ireland.db
            # Run a simple integrity check
            sqlite3 /tmp/db/epa_ireland.db "PRAGMA integrity_check;"
          else
            echo "Error: Database file not found"
            exit 1
          fi

      - name: Upload full database to S3
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.AWS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_bucket: ${{ secrets.AWS_BUCKET }}
          source_dir: '/tmp/db'
          destination_dir: ''

